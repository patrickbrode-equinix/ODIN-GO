<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schichtplaner Erweiterung</title>
    <style>
      body { margin: 0; background: #0f141b; color: #e7ebf0; font: 14px/1.5 "Segoe UI",system-ui,Arial,sans-serif; }
      main { width: min(640px,calc(100% - 40px)); margin: 48px auto; padding: 24px; border: 1px solid #2c3644; border-radius: 8px; background: #171d26; }
      h1 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 13px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #2c3644; border-radius: 6px; background: #10151c; color: #e7ebf0; }
      input:focus { outline: none; border-color: #4a86e8; }
      button { margin-top: 22px; padding: 10px 18px; border: 0; border-radius: 6px; background: #2f6fd0; color: white; font-weight: 600; cursor: pointer; }
      button:hover { background: #3a7be0; }
      button.secondary { margin-left: 8px; background: #2a3544; }
      button.secondary:hover { background: #343f50; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { margin-left: 12px; color: #6fcf97; }
      p { color: #8c97a7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Schichtplaner für Jarvis</h1>
      <p>Die VM-Adresse muss vom Browser erreichbar sein. Der Mitarbeiter wird automatisch aus dem angemeldeten Jarvis-SSO-Profil übernommen und mit der Schichtplaner-Datenbank abgeglichen.</p>
      <label for="plannerUrl">HTTPS-Adresse von ODIN GO</label>
      <input id="plannerUrl" type="url" placeholder="https://eqx-portal.corp.equinix.com" />
      <label for="apiKey">Lokaler App-Schlüssel</label>
      <input id="apiKey" type="password" placeholder="SHIFTPLANNER_API_KEY der VM" autocomplete="off" />
      <p>Dieser Schlüssel verbindet die Erweiterung sicher mit dem Schichtplaner-Backend auf der VM.</p>
      <button id="save" type="button">Speichern</button>
      <button id="test" type="button" class="secondary">Verbindung testen</button>
      <span id="status" role="status" aria-live="polite"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
