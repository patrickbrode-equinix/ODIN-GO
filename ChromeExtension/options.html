<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schichtplaner Erweiterung</title>
    <style>
      body { margin: 0; background: #07101c; color: #e8f5ff; font: 14px/1.5 Segoe UI,Arial,sans-serif; }
      main { width: min(680px,calc(100% - 40px)); margin: 50px auto; padding: 28px; border: 1px solid #23445b; border-radius: 16px; background: #0b1a29; }
      h1 { margin-top: 0; }
      label { display: block; margin: 18px 0 6px; font-weight: 700; }
      input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #355b75; border-radius: 8px; background: #06111c; color: white; }
      button { margin-top: 22px; padding: 11px 18px; border: 0; border-radius: 8px; background: #008dca; color: white; font-weight: 800; cursor: pointer; }
      #status { margin-left: 12px; color: #7ce6ad; }
      p { color: #9db5c6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Schichtplaner für Jarvis</h1>
      <p>Die VM-Adresse muss vom Browser erreichbar sein. Der Mitarbeiter wird automatisch aus dem angemeldeten Jarvis-SSO-Profil übernommen und mit der Schichtplaner-Datenbank abgeglichen.</p>
      <label for="plannerUrl">Adresse des Schichtplaners auf der VM</label>
      <input id="plannerUrl" type="url" placeholder="https://schichtplaner.firma.local" />
      <label for="apiKey">Lokaler App-Schlüssel</label>
      <input id="apiKey" type="password" placeholder="SHIFTPLANNER_API_KEY der VM" autocomplete="off" />
      <p>Dieser Schlüssel verbindet die Erweiterung sicher mit dem Schichtplaner-Backend auf der VM.</p>
      <button id="save" type="button">Speichern</button><span id="status"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
