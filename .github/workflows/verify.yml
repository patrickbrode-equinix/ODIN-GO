name: Verify clean deployment

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-jwt-secret
          SHIFTPLANNER_API_KEY: ci-only-application-key
        run: docker compose config --quiet
      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/caddy:/etc/caddy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix Backend
      - name: Run backend tests
        env:
          APP_MODE: shiftplanner
          JWT_SECRET: ci-only-jwt-secret
          SHIFTPLANNER_API_KEY: ci-only-application-key
          OPERATIONAL_TIMEZONE: Europe/Berlin
        run: npm test --prefix Backend
      - name: Install frontend dependencies
        run: npm ci --prefix Frontend
      - name: Build frontend
        run: npm run build --prefix Frontend
