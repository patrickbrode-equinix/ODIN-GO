name: Diagnose deployment

on:
  push:
    branches: [ci-diagnose]

env:
  DB_PASSWORD: ci-only-database-password
  JWT_SECRET: ci-only-jwt-secret
  SHIFTPLANNER_API_KEY: ci-only-application-key
  OPERATIONAL_TIMEZONE: Europe/Berlin

jobs:
  compose-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the backend
        run: sleep 100
      - name: Publish service state and logs as annotations
        if: always()
        run: |
          emit() {
            body=$(cat | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{gsub(/\r/,"%0D");print}')
            echo "::error title=$1::${body}"
          }
          docker compose ps -a 2>&1 | emit "compose-ps"
          docker compose logs --no-color backend 2>&1 | grep -v "Applied:" | tail -60 | emit "backend-log"; docker compose logs --no-color backend 2>&1 | grep -c "Applied:" | emit "migrations-applied-count"; docker compose logs --no-color backend 2>&1 | grep "Applied:" | tail -4 | emit "last-applied"
          docker compose logs --no-color --tail 15 postgres 2>&1 | emit "postgres-log"
          docker compose logs --no-color --tail 15 frontend 2>&1 | emit "frontend-log"

