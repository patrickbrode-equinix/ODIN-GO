name: Diagnose deployment

on:
  push:
    branches: [ci-diagnose]

permissions:
  contents: write

env:
  DB_PASSWORD: ci-only-database-password
  JWT_SECRET: ci-only-jwt-secret
  SHIFTPLANNER_API_KEY: ci-only-application-key
  OPERATIONAL_TIMEZONE: Europe/Berlin

jobs:
  compose-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the backend
        run: sleep 110
      - name: Collect service state and logs
        if: always()
        run: |
          mkdir -p diagnose-output
          docker compose ps -a > diagnose-output/ps.txt 2>&1 || true
          docker compose logs --no-color backend > diagnose-output/backend-full.log 2>&1 || true
          grep -v "Applied:" diagnose-output/backend-full.log | tail -150 > diagnose-output/backend-important.log || true
          docker compose logs --no-color frontend > diagnose-output/frontend.log 2>&1 || true
          docker compose exec -T backend wget -qO- http://localhost:8001/api/health/ready > diagnose-output/ready.txt 2>&1 || echo "ready check failed" >> diagnose-output/ready.txt
          docker inspect --format '{{json .State.Health}}' "$(docker compose ps -q backend)" > diagnose-output/health.json 2>&1 || true
      - name: Publish the results on the branch
        if: always()
        run: |
          git config user.name "ci-diagnose"
          git config user.email "ci-diagnose@users.noreply.github.com"
          git add -f diagnose-output
          git commit -m "ci: diagnose output" || exit 0
          git push origin HEAD:ci-diagnose
